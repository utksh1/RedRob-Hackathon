reproduce_command: "python rank.py --candidates ./India_runs_data_and_ai_challenge/candidates.json --out ./submission.csv"

methodology_summary: >
  A five-stage, CPU-only pipeline (no GPU, no network, ~20s on 100K). Stage 1 flags
  ~96 honeypots with impossible timelines/credentials; Stage 2 hard-filters all-consulting
  careers, non-relocating non-India candidates, zero-experience, and non-technical
  keyword-stuffers. Stage 3 scores survivors on seven axes, the most important being a
  BM25 + TF-IDF relevance match of the full job description against each candidate's
  free-text (summary + career descriptions), not a keyword list — this surfaces the JD's
  "plain-language" candidates who describe real retrieval/ranking work without buzzwords,
  and demotes adjacent ML (sentiment, fraud, CV-only). An availability multiplier gates
  unreachable candidates. Stage 4 ranks by composite; Stage 5 generates per-candidate
  reasoning that cites concrete facts, names the JD requirement evidenced, and honestly
  surfaces concerns (notice period, inactivity, off-core work), with tone scaled to rank.
  Zero external dependencies; fully reproducible from a single command.
